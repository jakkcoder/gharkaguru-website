<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finalized deals — login</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #f59e0b; --err: #f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: var(--card); border-radius: 12px; padding: 2rem; width: 100%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,.35); }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); font-size: .9rem; }
    label { display: block; font-size: .85rem; margin-bottom: .35rem; color: var(--muted); }
    input[type=password] { width: 100%; padding: .65rem .75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: var(--text); }
    button { margin-top: 1rem; width: 100%; padding: .7rem; border: none; border-radius: 8px; background: var(--accent); color: #0f172a; font-weight: 600; cursor: pointer; }
    .err { color: var(--err); font-size: .85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Finalized deals</h1>
    <p>Enrollment register (password required)</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/finilized_deals/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
