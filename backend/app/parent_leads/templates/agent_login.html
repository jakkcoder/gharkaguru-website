<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent login — Parent leads</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#f59e0b; --err:#f87171; }
    body { margin:0; min-height:100vh; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .card { background:var(--card); border-radius:12px; padding:2rem; width:100%; max-width:380px; }
    h1 { margin:0 0 .5rem; font-size:1.2rem; }
    p { margin:0 0 1.25rem; color:var(--muted); font-size:.9rem; }
    label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:.3rem; }
    input { width:100%; padding:.6rem; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text); box-sizing:border-box; margin-bottom:.5rem; }
    button { margin-top:.5rem; width:100%; padding:.65rem; border:none; border-radius:8px; background:var(--accent); color:#0f172a; font-weight:600; cursor:pointer; }
    .err { color:var(--err); font-size:.85rem; margin-bottom:.75rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Agent portal</h1>
    <p>View and advance your assigned parent leads</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/parent_leads/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
