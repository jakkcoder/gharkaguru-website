server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 25m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  location = /healthz {
    proxy_pass http://127.0.0.1:8081/healthz;
  }

  # Same-origin API (frontend uses VITE_API_BASE_URL=/v1)
  location /v1/ {
    proxy_pass http://127.0.0.1:8081/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8081/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Finalized deals enrollment register (FastAPI HTML)
  location ^~ /finilized_deals {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Parent leads inbox (v2 Cloud Run — Cloud SQL)
  location = /parent_leads {
    return 301 /parent_leads/;
  }

  location /parent_leads/ {
    proxy_pass https://parent-leads-inbox-v2-lmquvtnfja-as.a.run.app/parent_leads/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host parent-leads-inbox-v2-lmquvtnfja-as.a.run.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
  }

  # Video Meet app at /meeting
  location = /meeting {
    return 301 /meeting/;
  }

  location /meeting/ {
    proxy_pass https://video-meet-lmquvtnfja-el.a.run.app/meeting/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host video-meet-lmquvtnfja-el.a.run.app;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Tutor onboarding app at /onboard_tutor
  location = /onboard_tutor {
    return 301 /onboard_tutor/;
  }

  location /onboard_tutor/ {
    proxy_pass https://gharkaguru-tutor-onboarding-954888342020.asia-south1.run.app/onboard_tutor/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host gharkaguru-tutor-onboarding-954888342020.asia-south1.run.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 30m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
